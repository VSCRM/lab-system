<!doctype html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
		<link rel="manifest" href="%BASE_URL%manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<!--
			Note: `frame-ancestors` (and `report-uri`/`sandbox`) are intentionally
			NOT included here — browsers silently ignore those directives when CSP
			is delivered via a <meta> element (only a real HTTP response header can
			enforce them). GitHub Pages doesn't support custom response headers, so
			enforcing frame-ancestors would require moving to a host that does
			(e.g. Cloudflare Pages, Netlify _headers) and setting it there instead.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://openrouter.ai https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
		/>
		<meta
			name="description"
			content="Калькулятор трудомісткості та вартості розробки програмного забезпечення: COCOMO II, метод функціональних точок та інші метрики програмної інженерії."
		/>
		<title>Калькулятор трудомісткості ПЗ</title>

		<!-- Open Graph / social preview -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Калькулятор трудомісткості ПЗ" />
		<meta property="og:title" content="Калькулятор трудомісткості розробки ПЗ" />
		<meta
			property="og:description"
			content="COCOMO II, метод функціональних точок та інші метрики програмної інженерії — 6 інтерактивних лабораторних робіт."
		/>
		<meta property="og:locale" content="uk_UA" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Калькулятор трудомісткості розробки ПЗ" />
		<meta name="twitter:description" content="COCOMO II, метод функціональних точок та інші метрики програмної інженерії." />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
